name: Cloudflare Worker Function deploy

on:
  push:
    branches: [main]
    paths:
      - "cf-worker-linux-packages/functions/**"
      - "cf-worker-linux-packages/wrangler.toml"
      - ".github/workflows/cf_worker.yaml"

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PAGES_FUNCTION_API_TOKEN }}
    steps:
      - uses: actions/checkout@v6
      - uses: jdx/mise-action@v4
        with:
          cache_key: "mise-{{platform}}-{{version}}-{{file_hash}}"
          version: "2026.3.10"
      - name: Deploy Page function
        run: |
          mise run repo:frontend:deploy
